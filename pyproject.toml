[project]
name = "pythonproject"
version = "0.1.0"
description = ""

authors = [
    {name = "LexaNovikov",email = "lexaproxa228@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]
[tool.poetry]
package-mode = false
[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
exclude = '''
(
    /(
        \.venv
        \.poetry.lock
        \.pyproject.toml
        \.flake8
        \src/__init__.py
        \tests/__init__.py
    )/
)'''
[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.venv
        \.poetry.lock
        \.pyproject.toml
        \.flake8
        \src/__init__.py
        \tests/__init__.py
    )/
)'''
[tool.isort]
line-length = 119
[tool.flake8]
max-line-length = 119